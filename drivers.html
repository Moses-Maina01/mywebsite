<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Drivers - Fleet Management System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <h2>Fleet System</h2>

    <a href="index.html">Dashboard</a>
    <a href="vehicles.html">Vehicles</a>
    <a href="drivers.html">Drivers</a>
    <a href="revenue.html">Revenue</a>
    <a href="fuel.html">Fuel</a>
    <a href="attendance.html">Attendance</a>
    <a href="reports.html">Reports</a>
    <a href="login.html">Logout</a>
</div>

<!-- MAIN -->
<div class="main">

    <h1>Driver Management</h1>

    <!-- FORM -->
    <div class="card">

        <h3>Add / Edit Driver</h3>

        <form id="driverForm">

            <input type="text" id="driverName" placeholder="Driver Name" required>

            <input type="text" id="driverPhone" placeholder="Phone Number" required>

            <input type="text" id="driverLicense" placeholder="License Number" required>

            <button type="submit">Save Driver</button>

        </form>

    </div>

    <!-- SEARCH -->
    <div class="card">

        <input type="text" id="searchDriver" placeholder="Search Driver...">

    </div>

    <!-- TABLE -->
    <div class="card">

        <h3>Driver List</h3>

        <table border="1" width="100%">

            <thead>
                <tr>
                    <th>Name</th>
                    <th>Phone</th>
                    <th>License</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="driverTable"></tbody>

        </table>

    </div>

</div>

<script>
if (localStorage.getItem("loggedIn") !== "true") {
    window.location.href = "login.html";
}
let drivers = JSON.parse(localStorage.getItem("drivers")) || [];

const driverForm = document.getElementById("driverForm");
const driverTable = document.getElementById("driverTable");

let editIndex = null;

// SAVE
function saveDrivers() {
    localStorage.setItem("drivers", JSON.stringify(drivers));
}

// DISPLAY
function displayDrivers() {

    const search = document
    .getElementById("searchDriver")
    .value
    .toLowerCase();

    driverTable.innerHTML = "";

    drivers
    .filter(d =>
        d.name.toLowerCase().includes(search) ||
        d.phone.toLowerCase().includes(search) ||
        d.license.toLowerCase().includes(search)
    )

    .forEach((d, index) => {

        driverTable.innerHTML += `
            <tr>
                <td>${d.name}</td>
                <td>${d.phone}</td>
                <td>${d.license}</td>

                <td>
                    <button onclick="editDriver(${index})">
                        Edit
                    </button>

                    <button onclick="deleteDriver(${index})">
                        Delete
                    </button>
                </td>
            </tr>
        `;
    });
}

// ADD / UPDATE
driverForm.addEventListener("submit", function(e){

    e.preventDefault();

    const driver = {

        name: document.getElementById("driverName").value,

        phone: document.getElementById("driverPhone").value,
         
        license: document.getElementById("driveridnumber").value

        license: document.getElementById("driverLicense").value
    };

    if(editIndex === null){

        drivers.push(driver);

    } else {

        drivers[editIndex] = driver;
        editIndex = null;
    }

    saveDrivers();
    displayDrivers();

    driverForm.reset();
});

// DELETE
function deleteDriver(index){

    drivers.splice(index, 1);

    saveDrivers();
    displayDrivers();
}

// EDIT
function editDriver(index){

    const d = drivers[index];

    document.getElementById("driverName").value = d.name;

    document.getElementById("driverPhone").value = d.phone;

    document.getElementById("driverLicense").value = d.license;

    editIndex = index;
}

// SEARCH
document
.getElementById("searchDriver")
.addEventListener("keyup", displayDrivers);

// INIT
displayDrivers();

</script>

</body>
</html>
