<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Management - Fleet System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="sidebar">
    <h2>Fleet System</h2>

    <a href="index.html">Dashboard</a>
    <a href="vehicles.html">Vehicles</a>
    <a href="drivers.html">Drivers</a>
    <a href="revenue.html">Revenue</a>
    <a href="fuel.html">Fuel</a>
    <a href="attendance.html">Attendance</a>
    <a href="reports.html">Reports</a>
    <a href="login.html">Logout</a>
</div>

<div class="main">

    <h1>Vehicle Management</h1>

    <div class="card">
        <h3>Add / Edit Vehicle</h3>

        <form id="vehicleForm">
            <input type="text" id="vehicleNumber" placeholder="Vehicle Number" required>
            <input type="text" id="vehicleModel" placeholder="Vehicle Model" required>
            <input type="text" id="vehicleRoute" placeholder="Route" required>
            <input type="text" id="vehicleStatus" placeholder="Status" required>
            <button type="submit">Save Vehicle</button>
        </form>
    </div>

    <div class="card">
        <input type="text" id="searchVehicle" placeholder="Search Vehicle...">
    </div>

    <div class="card">
        <h3>Fleet Vehicles</h3>

        <table border="1" width="100%">
            <thead>
                <tr>
                    <th>Vehicle No.</th>
                    <th>Model</th>
                    <th>Route</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="vehicleTable"></tbody>
        </table>
    </div>

</div>

<script>

let defaultVehicles = [
    {number:"116", model:"NQR ISUZU", route:"39", status:"Active"},
    {number:"118", model:"NQR ISUZU", route:"39", status:"Active"},
    {number:"119", model:"NQR ISUZU", route:"39", status:"Active"},
    {number:"304", model:"NQR ISUZU", route:"39", status:"Active"},
    {number:"307", model:"NQR ISUZU", route:"39", status:"Active"},
    {number:"308", model:"NQR ISUZU", route:"39", status:"Active"},
    {number:"316", model:"NQR ISUZU", route:"39", status:"Active"},
    {number:"317", model:"NQR ISUZU", route:"39", status:"Active"},
    {number:"581", model:"NQR ISUZU", route:"39", status:"Active"},
    {number:"681", model:"NQR ISUZU", route:"39", status:"Active"},
    {number:"781", model:"NQR ISUZU", route:"39", status:"Active"},
    {number:"951", model:"NQR ISUZU", route:"39", status:"Active"},
    {number:"952", model:"NQR ISUZU", route:"39", status:"Active"},
    {number:"1045", model:"NQR ISUZU", route:"39", status:"Active"},
    {number:"1059", model:"NQR ISUZU", route:"39", status:"Active"},
    {number:"1060", model:"NQR ISUZU", route:"39", status:"Active"},
    {number:"1061", model:"NQR ISUZU", route:"39", status:"Active"},
    {number:"1062", model:"NQR ISUZU", route:"39", status:"Active"}
];

// ✅ SAFE LOAD (FIXED)
let vehicles = JSON.parse(localStorage.getItem("vehicles") || "null");

if (!Array.isArray(vehicles) || vehicles.length === 0) {
    vehicles = defaultVehicles;
    localStorage.setItem("vehicles", JSON.stringify(vehicles));
}

let editIndex = null;

const vehicleForm = document.getElementById("vehicleForm");
const vehicleTable = document.getElementById("vehicleTable");

// SAVE
function saveVehicles() {
    localStorage.setItem("vehicles", JSON.stringify(vehicles));
}

// DISPLAY (FIXED INDEX BUG)
function displayVehicles() {

    const search = document.getElementById("searchVehicle").value.toLowerCase();

    vehicleTable.innerHTML = "";

    vehicles.forEach((v, index) => {

        if (
            v.number.toLowerCase().includes(search) ||
            v.model.toLowerCase().includes(search) ||
            v.route.toLowerCase().includes(search) ||
            v.status.toLowerCase().includes(search)
        ) {

            vehicleTable.innerHTML += `
                <tr>
                    <td>${v.number}</td>
                    <td>${v.model}</td>
                    <td>${v.route}</td>
                    <td>${v.status}</td>
                    <td>
                        <button onclick="editVehicle(${index})">Edit</button>
                        <button onclick="deleteVehicle(${index})">Delete</button>
                    </td>
                </tr>
            `;
        }
    });
}

// ADD / UPDATE
vehicleForm.addEventListener("submit", function(e) {
    e.preventDefault();

    const vehicle = {
        number: document.getElementById("vehicleNumber").value,
        model: document.getElementById("vehicleModel").value,
        route: document.getElementById("vehicleRoute").value,
        status: document.getElementById("vehicleStatus").value
    };

    if (editIndex === null) {
        vehicles.push(vehicle);
    } else {
        vehicles[editIndex] = vehicle;
        editIndex = null;
    }

    saveVehicles();
    displayVehicles();
    vehicleForm.reset();
});

// DELETE
function deleteVehicle(index) {
    vehicles.splice(index, 1);
    saveVehicles();
    displayVehicles();
}

// EDIT
function editVehicle(index) {
    const v = vehicles[index];

    document.getElementById("vehicleNumber").value = v.number;
    document.getElementById("vehicleModel").value = v.model;
    document.getElementById("vehicleRoute").value = v.route;
    document.getElementById("vehicleStatus").value = v.status;

    editIndex = index;
}

// SEARCH
document.getElementById("searchVehicle").addEventListener("keyup", displayVehicles);

// INIT
displayVehicles();

console.log("Vehicles loaded:", vehicles);

</script>

</body>
</html>
