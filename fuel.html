<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fuel Management - Fleet System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <h2>Fleet System</h2>

    <a href="index.html">Dashboard</a>
    <a href="vehicles.html">Vehicles</a>
    <a href="drivers.html">Drivers</a>
    <a href="revenue.html">Revenue</a>
    <a href="fuel.html">Fuel</a>
    <a href="attendance.html">Attendance</a>
    <a href="reports.html">Reports</a>
    <a href="login.html">Logout</a>
</div>

<!-- MAIN -->
<div class="main">

    <h1>Fuel Management</h1>

    <!-- FORM -->
    <div class="card">

        <h3>Add Fuel Record</h3>

        <form id="fuelForm">

            <input type="text" id="vehicle" placeholder="Vehicle Number" required>

            <input type="number" id="liters" placeholder="Fuel Liters" required>

            <input type="number" id="cost" placeholder="Fuel Cost" required>

            <input type="date" id="date" required>

            <button type="submit">Save Fuel</button>

        </form>

    </div>

    <!-- SEARCH -->
    <div class="card">

        <input type="text" id="searchFuel" placeholder="Search Fuel Records...">

    </div>

    <!-- TABLE -->
    <div class="card">

        <h3>Fuel Records</h3>

        <table border="1" width="100%">

            <thead>
                <tr>
                    <th>Vehicle</th>
                    <th>Liters</th>
                    <th>Cost</th>
                    <th>Date</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="fuelTable"></tbody>

        </table>

    </div>

</div>

<script>

let fuel = JSON.parse(localStorage.getItem("fuel")) || [];

const fuelForm = document.getElementById("fuelForm");
const fuelTable = document.getElementById("fuelTable");

let editIndex = null;

// SAVE
function saveFuel(){

    localStorage.setItem("fuel", JSON.stringify(fuel));
}

// DISPLAY
function displayFuel(){

    const search = document
    .getElementById("searchFuel")
    .value
    .toLowerCase();

    fuelTable.innerHTML = "";

    fuel
    .filter(f =>
        f.vehicle.toLowerCase().includes(search) ||
        f.date.toLowerCase().includes(search)
    )

    .forEach((f, index) => {

        fuelTable.innerHTML += `
            <tr>
                <td>${f.vehicle}</td>
                <td>${f.liters}</td>
                <td>${f.cost}</td>
                <td>${f.date}</td>

                <td>
                    <button onclick="editFuel(${index})">
                        Edit
                    </button>

                    <button onclick="deleteFuel(${index})">
                        Delete
                    </button>
                </td>
            </tr>
        `;
    });
}

// ADD / UPDATE
fuelForm.addEventListener("submit", function(e){

    e.preventDefault();

    const fuelData = {

        vehicle: document.getElementById("vehicle").value,

        liters: document.getElementById("liters").value,

        cost: document.getElementById("cost").value,

        date: document.getElementById("date").value
    };

    if(editIndex === null){

        fuel.push(fuelData);

    } else {

        fuel[editIndex] = fuelData;
        editIndex = null;
    }

    saveFuel();
    displayFuel();

    fuelForm.reset();
});

// DELETE
function deleteFuel(index){

    fuel.splice(index, 1);

    saveFuel();
    displayFuel();
}

// EDIT
function editFuel(index){

    const f = fuel[index];

    document.getElementById("vehicle").value = f.vehicle;

    document.getElementById("liters").value = f.liters;

    document.getElementById("cost").value = f.cost;

    document.getElementById("date").value = f.date;

    editIndex = index;
}

// SEARCH
document
.getElementById("searchFuel")
.addEventListener("keyup", displayFuel);

// INIT
displayFuel();

</script>

</body>
</html>
