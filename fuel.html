<!DOCTYPE html>
<html>
<head>
  <title>Fuel Management</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="sidebar">
  <h2>Fleet System</h2>

  <ul>
    <li><a href="index.html">Dashboard</a></li>
    <li><a href="vehicles.html">Vehicles</a></li>
    <li><a href="drivers.html">Drivers</a></li>
    <li><a href="revenue.html">Revenue</a></li>
    <li><a href="fuel.html">Fuel</a></li>
    <li><a href="reports.html">Reports</a></li>
    <li><a href="attendance.html">Attendance</a></li>
    <li><a href="admin.html">Admin</a></li>
    <li><a href="login.html">Logout</a></li>
  </ul>
</div>

<div class="main">

  <h1>Fuel Management</h1>

  <div class="form-box">

    <h2>Add Fuel Record</h2>

    <input type="text" id="fuelVehicle" placeholder="Vehicle Number">

    <input type="number" id="fuelLitres" placeholder="Litres">

    <input type="number" id="fuelCost" placeholder="Fuel Cost">

    <input type="date" id="fuelDate">

    <button onclick="addFuel()">Add Fuel</button>

  </div>

  <table id="fuelTable">

    <tr>
      <th>Vehicle</th>
      <th>Litres</th>
      <th>Cost</th>
      <th>Date</th>
    </tr>

    <tr>
      <td>116</td>
      <td>50</td>
      <td>KES 8,000</td>
      <td>2026-05-28</td>
    </tr>

  </table>

</div>

<script>

function addFuel(){

    let vehicle =
    document.getElementById("fuelVehicle").value;

    let litres =
    document.getElementById("fuelLitres").value;

    let cost =
    document.getElementById("fuelCost").value;

    let date =
    document.getElementById("fuelDate").value;

    if(vehicle === "" || litres === "" || cost === "" || date === ""){

        alert("Please fill all fields");

        return;
    }

    let table =
    document.getElementById("fuelTable");

    let row =
    table.insertRow();

    row.insertCell(0).innerHTML = vehicle;
    row.insertCell(1).innerHTML = litres;
    row.insertCell(2).innerHTML = "KES " + cost;
    row.insertCell(3).innerHTML = date;

    document.getElementById("fuelVehicle").value = "";
    document.getElementById("fuelLitres").value = "";
    document.getElementById("fuelCost").value = "";
    document.getElementById("fuelDate").value = "";

}

</script>

</body>
</html>
