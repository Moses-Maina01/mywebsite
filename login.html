<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fleet System Login</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(135deg, #0ea5e9, #16a34a);
}

.login-box{
    width:360px;
    background:white;
    padding:30px;
    border-radius:14px;
    box-shadow:0 12px 35px rgba(0,0,0,0.25);
    border-top:5px solid #16a34a;
}

.login-box h2{
    text-align:center;
    margin-bottom:20px;
    color:#0f172a;
}

.login-box input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #cbd5e1;
    border-radius:8px;
    outline:none;
}

.login-box input:focus{
    border-color:#0ea5e9;
}

.login-box button{
    width:100%;
    padding:12px;
    background:linear-gradient(90deg, #0ea5e9, #16a34a);
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
    margin-top:10px;
}

.login-box button:hover{
    opacity:0.9;
}
</style>

</head>

<body>

<div class="login-box">

    <h2>Fleet Management System</h2>

    <form onsubmit="login(event)">
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>

    <p style="text-align:center;font-size:12px;color:#64748b;margin-top:15px;">
        Secure Access System
    </p>

</div>

<script>

// 🔥 FIREBASE CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyBcrxG-6YtEfj41Upstwdm4Q6rD-5QMg0o",
  authDomain: "fleet-system-96fe5.firebaseapp.com",
  projectId: "fleet-system-96fe5",
  storageBucket: "fleet-system-96fe5.firebasestorage.app",
  messagingSenderId: "690441038472",
  appId: "1:690441038472:web:86cd0d0b043f0af8908d3d",
  measurementId: "G-YZC1Z0KB38"
};

// INIT FIREBASE
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

// 🔐 LOGIN FUNCTION
function login(e){
    e.preventDefault();

    let email = document.getElementById("email").value;
    let password = document.getElementById("password").value;

    auth.signInWithEmailAndPassword(email, password)
    .then((userCredential) => {

        localStorage.setItem("loggedIn", "true");
        localStorage.setItem("userEmail", email);

        window.location.href = "index.html";

    })
    .catch((error) => {
        alert("Login failed: " + error.message);
    });
}

</script>

</body>
</html>
