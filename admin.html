<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- 🔐 ACCESS CONTROL -->
<script>
if(localStorage.getItem("loggedIn") !== "true"){
    window.location.href = "login.html";
}
</script>

<!-- SIDEBAR -->
<div class="sidebar">

    <h2>Fleet System</h2>

    <a href="index.html">Dashboard</a>
    <a href="admin.html">Admin Panel</a>
    <a href="vehicles.html">Vehicles</a>
    <a href="drivers.html">Drivers</a>
    <a href="revenue.html">Revenue</a>
    <a href="fuel.html">Fuel</a>
    <a href="attendance.html">Attendance</a>
    <a href="reports.html">Reports</a>
    <a href="login.html">Logout</a>

</div>

<!-- MAIN -->
<div class="main">

    <h1>Admin Panel</h1>

    <!-- STATS -->
    <div class="cards">

        <div class="card">
            <h3>Total Vehicles</h3>
            <p id="vCount">0</p>
        </div>

        <div class="card">
            <h3>Total Drivers</h3>
            <p id="dCount">0</p>
        </div>

        <div class="card">
            <h3>System Status</h3>
            <p>ACTIVE</p>
        </div>

    </div>

    <!-- CREATE USER -->
    <div class="card" style="margin-top:20px;">

        <h3>Create User</h3>

        <input type="text" id="newUser" placeholder="Username">
        <input type="password" id="newPass" placeholder="Password">

        <select id="role">
            <option value="user">User</option>
            <option value="admin">Admin</option>
        </select>

        <button onclick="addUser()">Create User</button>

        <p id="msg"></p>

    </div>

    <!-- USERS TABLE -->
    <h3>System Users</h3>

    <table border="1" width="100%" cellpadding="8">
        <thead>
            <tr>
                <th>Username</th>
                <th>Role</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="usersTable"></tbody>
    </table>

</div>

<!-- EDIT POPUP -->
<div id="editBox" style="
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.5);
    justify-content:center;
    align-items:center;
    z-index:999;
">

    <div style="
        background:white;
        padding:20px;
        border-radius:10px;
        width:300px;
    ">

        <h3>Edit User</h3>

        <input type="text" id="editUsername" placeholder="Username"><br><br>
        <input type="password" id="editPassword" placeholder="Password"><br><br>

        <select id="editRole">
            <option value="user">User</option>
            <option value="admin">Admin</option>
        </select><br><br>

        <button onclick="saveEdit()">Save</button>
        <button onclick="closeEdit()">Cancel</button>

    </div>

</div>

<script>
alert("Admin script loaded");
    
// 📦 DATA
let vehicles = JSON.parse(localStorage.getItem("vehicles") || "[]");
let drivers = JSON.parse(localStorage.getItem("drivers") || "[]");

document.getElementById("vCount").innerText = vehicles.length;
document.getElementById("dCount").innerText = drivers.length;

// USERS
let users = JSON.parse(localStorage.getItem("users") || "[]");

// CREATE USER
function addUser(){

    let username = document.getElementById("newUser").value;
    let password = document.getElementById("newPass").value;
    let role = document.getElementById("role").value;

    if(username === "" || password === ""){
        alert("Fill all fields");
        return;
    }

    users.push({ username, password, role });

    localStorage.setItem("users", JSON.stringify(users));

    document.getElementById("msg").innerText = "User created successfully";

    document.getElementById("newUser").value = "";
    document.getElementById("newPass").value = "";

    loadUsers();
}

// LOAD USERS
function loadUsers(){

    let users = JSON.parse(localStorage.getItem("users") || "[]");

    let html = "";

    users.forEach((user, index) => {

        html += `
        <tr>
            <td>${user.username}</td>
            <td>${user.role}</td>
            <td>
                <button onclick="editUser(${index})">Edit</button>
                <button onclick="deleteUser(${index})">Delete</button>
            </td>
        </tr>`;
    });

    document.getElementById("usersTable").innerHTML = html;
}

// DELETE USER
function deleteUser(index){

    let users = JSON.parse(localStorage.getItem("users") || "[]");

    if(confirm("Delete this user?")){

        users.splice(index, 1);

        localStorage.setItem("users", JSON.stringify(users));

        loadUsers();
    }
}

// EDIT USER
let editIndex = null;

function editUser(index){

    let users = JSON.parse(localStorage.getItem("users") || "[]");

    editIndex = index;

    document.getElementById("editUsername").value = users[index].username;
    document.getElementById("editPassword").value = users[index].password;
    document.getElementById("editRole").value = users[index].role;

    document.getElementById("editBox").style.display = "flex";
}

function saveEdit(){

    let users = JSON.parse(localStorage.getItem("users") || "[]");

    users[editIndex].username = document.getElementById("editUsername").value;
    users[editIndex].password = document.getElementById("editPassword").value;
    users[editIndex].role = document.getElementById("editRole").value;

    localStorage.setItem("users", JSON.stringify(users));

    closeEdit();
    loadUsers();
}

function closeEdit(){
    document.getElementById("editBox").style.display = "none";
}

// INIT
loadUsers();

</script>

</body>
</html>
