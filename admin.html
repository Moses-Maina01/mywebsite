<script>

console.log("Admin script loaded");

// WAIT FOR PAGE TO LOAD PROPERLY
window.onload = function () {

    // 📦 DATA
    let vehicles = JSON.parse(localStorage.getItem("vehicles") || "[]");
    let drivers = JSON.parse(localStorage.getItem("drivers") || "[]");

    let vCount = document.getElementById("vCount");
    let dCount = document.getElementById("dCount");

    if(vCount) vCount.innerText = vehicles.length;
    if(dCount) dCount.innerText = drivers.length;

    loadUsers();
};

// USERS
let users = JSON.parse(localStorage.getItem("users") || "[]");

// CREATE USER
function addUser(){

    let username = document.getElementById("newUser").value;
    let password = document.getElementById("newPass").value;
    let role = document.getElementById("role").value;

    if(username === "" || password === ""){
        alert("Fill all fields");
        return;
    }

    users.push({ username, password, role });

    localStorage.setItem("users", JSON.stringify(users));

    document.getElementById("msg").innerText = "User created successfully";

    document.getElementById("newUser").value = "";
    document.getElementById("newPass").value = "";

    loadUsers();
}

// LOAD USERS
function loadUsers(){

    let users = JSON.parse(localStorage.getItem("users") || "[]");

    let html = "";

    users.forEach((user, index) => {

        html += `
        <tr>
            <td>${user.username}</td>
            <td>${user.role}</td>
            <td>
                <button onclick="editUser(${index})">Edit</button>
                <button onclick="deleteUser(${index})">Delete</button>
            </td>
        </tr>`;
    });

    document.getElementById("usersTable").innerHTML = html;
}

// DELETE
function deleteUser(index){

    let users = JSON.parse(localStorage.getItem("users") || "[]");

    users.splice(index, 1);

    localStorage.setItem("users", JSON.stringify(users));

    loadUsers();
}

// EDIT
let editIndex = null;

function editUser(index){

    let users = JSON.parse(localStorage.getItem("users") || "[]");

    editIndex = index;

    document.getElementById("editUsername").value = users[index].username;
    document.getElementById("editPassword").value = users[index].password;
    document.getElementById("editRole").value = users[index].role;

    document.getElementById("editBox").style.display = "flex";
}

function saveEdit(){

    let users = JSON.parse(localStorage.getItem("users") || "[]");

    users[editIndex].username = document.getElementById("editUsername").value;
    users[editIndex].password = document.getElementById("editPassword").value;
    users[editIndex].role = document.getElementById("editRole").value;

    localStorage.setItem("users", JSON.stringify(users));

    closeEdit();
    loadUsers();
}

function closeEdit(){
    document.getElementById("editBox").style.display = "none";
}

</script>
