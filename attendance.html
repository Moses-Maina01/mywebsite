<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Management - Fleet System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

    <h2>Fleet System</h2>

    <a href="index.html">Dashboard</a>
    <a href="vehicles.html">Vehicles</a>
    <a href="drivers.html">Drivers</a>
    <a href="revenue.html">Revenue</a>
    <a href="fuel.html">Fuel</a>
    <a href="attendance.html">Attendance</a>
    <a href="reports.html">Reports</a>
    <a href="login.html">Logout</a>

</div>

<!-- MAIN -->
<div class="main">

    <h1>Attendance Management</h1>

    <!-- FORM -->
    <div class="card">

        <h3>Add Attendance</h3>

        <form id="attendanceForm">

            <input type="text" id="employeeName" placeholder="Employee Name" required>

            <input type="text" id="position" placeholder="Position" required>

            <input type="date" id="date" required>

            <select id="status" required>
                <option value="">Select Status</option>
                <option value="Present">Present</option>
                <option value="Absent">Absent</option>
                <option value="Off">Off</option>
            </select>

            <button type="submit">Save Attendance</button>

        </form>

    </div>

    <!-- SEARCH -->
    <div class="card">

        <input type="text" id="searchAttendance" placeholder="Search Attendance...">

    </div>

    <!-- TABLE -->
    <div class="card">

        <h3>Attendance Records</h3>

        <table border="1" width="100%">

            <thead>
                <tr>
                    <th>Employee</th>
                    <th>Position</th>
                    <th>Date</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="attendanceTable"></tbody>

        </table>

    </div>

</div>

<script>
if (localStorage.getItem("loggedIn") !== "true") {
    window.location.href = "login.html";
}
let attendance = JSON.parse(localStorage.getItem("attendance")) || [];

const attendanceForm = document.getElementById("attendanceForm");
const attendanceTable = document.getElementById("attendanceTable");

let editIndex = null;

// SAVE
function saveAttendance(){

    localStorage.setItem("attendance", JSON.stringify(attendance));
}

// DISPLAY
function displayAttendance(){

    const search = document
    .getElementById("searchAttendance")
    .value
    .toLowerCase();

    attendanceTable.innerHTML = "";

    attendance
    .filter(a =>
        a.employee.toLowerCase().includes(search) ||
        a.position.toLowerCase().includes(search) ||
        a.status.toLowerCase().includes(search)
    )

    .forEach((a, index) => {

        attendanceTable.innerHTML += `
            <tr>
                <td>${a.employee}</td>
                <td>${a.position}</td>
                <td>${a.date}</td>
                <td>${a.status}</td>

                <td>

                    <button onclick="editAttendance(${index})">
                        Edit
                    </button>

                    <button onclick="deleteAttendance(${index})">
                        Delete
                    </button>

                </td>
            </tr>
        `;
    });
}

// ADD / UPDATE
attendanceForm.addEventListener("submit", function(e){

    e.preventDefault();

    const attendanceData = {

        employee: document.getElementById("employeeName").value,

        position: document.getElementById("position").value,

        date: document.getElementById("date").value,

        status: document.getElementById("status").value
    };

    if(editIndex === null){

        attendance.push(attendanceData);

    } else {

        attendance[editIndex] = attendanceData;
        editIndex = null;
    }

    saveAttendance();
    displayAttendance();

    attendanceForm.reset();
});

// DELETE
function deleteAttendance(index){

    attendance.splice(index, 1);

    saveAttendance();
    displayAttendance();
}

// EDIT
function editAttendance(index){

    const a = attendance[index];

    document.getElementById("employeeName").value = a.employee;

    document.getElementById("position").value = a.position;

    document.getElementById("date").value = a.date;

    document.getElementById("status").value = a.status;

    editIndex = index;
}

// SEARCH
document
.getElementById("searchAttendance")
.addEventListener("keyup", displayAttendance);

// INIT
displayAttendance();

</script>

</body>
</html>
