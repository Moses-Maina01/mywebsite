<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Revenue - Fleet Management System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <h2>Fleet System</h2>

    <a href="index.html">Dashboard</a>
    <a href="vehicles.html">Vehicles</a>
    <a href="drivers.html">Drivers</a>
    <a href="revenue.html">Revenue</a>
    <a href="fuel.html">Fuel</a>
    <a href="attendance.html">Attendance</a>
    <a href="reports.html">Reports</a>
    <a href="login.html">Logout</a>
</div>

<!-- MAIN -->
<div class="main">

    <h1>Revenue Management</h1>

    <!-- FORM -->
    <div class="card">

        <h3>Add Revenue</h3>

        <form id="revenueForm">

            <input type="text" id="vehicle" placeholder="Vehicle Number" required>

            <input type="number" id="amount" placeholder="Revenue Amount" required>

            <input type="date" id="date" required>

            <button type="submit">Save Revenue</button>

        </form>

    </div>

    <!-- SEARCH -->
    <div class="card">

        <input type="text" id="searchRevenue" placeholder="Search Revenue...">

    </div>

    <!-- TABLE -->
    <div class="card">

        <h3>Revenue Records</h3>

        <table border="1" width="100%">

            <thead>
                <tr>
                    <th>Vehicle</th>
                    <th>Amount</th>
                    <th>Date</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="revenueTable"></tbody>

        </table>

    </div>

</div>

<script>

let revenue = JSON.parse(localStorage.getItem("revenue")) || [];

const revenueForm = document.getElementById("revenueForm");
const revenueTable = document.getElementById("revenueTable");

let editIndex = null;

// SAVE
function saveRevenue(){

    localStorage.setItem("revenue", JSON.stringify(revenue));
}

// DISPLAY
function displayRevenue(){

    const search = document
    .getElementById("searchRevenue")
    .value
    .toLowerCase();

    revenueTable.innerHTML = "";

    revenue
    .filter(r =>
        r.vehicle.toLowerCase().includes(search) ||
        r.date.toLowerCase().includes(search)
    )

    .forEach((r, index) => {

        revenueTable.innerHTML += `
            <tr>
                <td>${r.vehicle}</td>
                <td>${r.amount}</td>
                <td>${r.date}</td>

                <td>
                    <button onclick="editRevenue(${index})">
                        Edit
                    </button>

                    <button onclick="deleteRevenue(${index})">
                        Delete
                    </button>
                </td>
            </tr>
        `;
    });
}

// ADD / UPDATE
revenueForm.addEventListener("submit", function(e){

    e.preventDefault();

    const revenueData = {

        vehicle: document.getElementById("vehicle").value,

        amount: document.getElementById("amount").value,

        date: document.getElementById("date").value
    };

    if(editIndex === null){

        revenue.push(revenueData);

    } else {

        revenue[editIndex] = revenueData;
        editIndex = null;
    }

    saveRevenue();
    displayRevenue();

    revenueForm.reset();
});

// DELETE
function deleteRevenue(index){

    revenue.splice(index, 1);

    saveRevenue();
    displayRevenue();
}

// EDIT
function editRevenue(index){

    const r = revenue[index];

    document.getElementById("vehicle").value = r.vehicle;

    document.getElementById("amount").value = r.amount;

    document.getElementById("date").value = r.date;

    editIndex = index;
}

// SEARCH
document
.getElementById("searchRevenue")
.addEventListener("keyup", displayRevenue);

// INIT
displayRevenue();

</script>

</body>
</html>
