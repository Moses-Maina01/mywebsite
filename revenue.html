<!DOCTYPE html>
<html>
<head>
  <title>Revenue</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="sidebar">
  <h2>Fleet System</h2>

  <ul>
    <li><a href="index.html">Dashboard</a></li>
    <li><a href="vehicles.html">Vehicles</a></li>
    <li><a href="drivers.html">Drivers</a></li>
    <li><a href="revenue.html">Revenue</a></li>
    <li><a href="fuel.html">Fuel</a></li>
    <li><a href="reports.html">Reports</a></li>
    <li><a href="attendance.html">Attendance</a></li>
    <li><a href="admin.html">Admin</a></li>
    <li><a href="login.html">Logout</a></li>
  </ul>
</div>

<div class="main">

  <h1>Revenue Management</h1>

  <div class="form-box">

    <h2>Add Revenue</h2>

    <input type="text" id="vehicleNumber" placeholder="Vehicle Number">

    <input type="text" id="driverName" placeholder="Driver Name">

    <input type="number" id="revenueAmount" placeholder="Revenue Amount">

    <input type="date" id="revenueDate">

    <button onclick="addRevenue()">Add Revenue</button>

  </div>

  <table id="revenueTable">

    <tr>
      <th>Vehicle</th>
      <th>Driver</th>
      <th>Revenue</th>
      <th>Date</th>
    </tr>

    <tr>
      <td>116</td>
      <td>Maina</td>
      <td>KES 8500</td>
      <td>2026-05-28</td>
    </tr>

  </table>

</div>

<script>

function addRevenue(){

    let vehicle =
    document.getElementById("vehicleNumber").value;

    let driver =
    document.getElementById("driverName").value;

    let revenue =
    document.getElementById("revenueAmount").value;

    let date =
    document.getElementById("revenueDate").value;

    if(vehicle === "" || driver === "" || revenue === "" || date === ""){

        alert("Please fill all fields");

        return;
    }

    let table =
    document.getElementById("revenueTable");

    let row =
    table.insertRow();

    row.insertCell(0).innerHTML = vehicle;
    row.insertCell(1).innerHTML = driver;
    row.insertCell(2).innerHTML = "KES " + revenue;
    row.insertCell(3).innerHTML = date;

    document.getElementById("vehicleNumber").value = "";
    document.getElementById("driverName").value = "";
    document.getElementById("revenueAmount").value = "";
    document.getElementById("revenueDate").value = "";

}

</script>

</body>
</html>
